aid: shufti-pro
name: Shufti Pro
description: Shufti Pro is an AI-powered identity verification platform offering a REST API for document
  verification, face biometrics, AML screening, business verification (KYB), and address verification.
  The platform supports 10,000+ document types across 230+ countries and territories, integrates with
  1700+ AML watchlists, and provides mobile SDKs for Android, iOS, Flutter, and React Native.
