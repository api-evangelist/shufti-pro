apis:
- aid: shufti-pro:verification-api
  name: Shufti Pro Verification API
  description: >-
    REST API for end-to-end identity verification including document verification, facial biometrics with
    liveness detection, address verification, AML screening against 1700+ watchlists, phone and email
    MFA, VideoIdent, and electronic signatures. Supports both onsite and offsite verification modes with
    server-to-server callback notifications.
